<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f0f2f5; color: #333; }
        
        .header { background: linear-gradient(135deg, #ff6b35, #f7931e); color: #fff; padding: 20px 16px; }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: -20px -8px 0; }
        .stat-card { background: #fff; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-value { font-size: 28px; font-weight: 700; color: #ff6b35; }
        .stat-label { font-size: 12px; color: #999; margin-top: 4px; }
        
        .content { padding: 16px 8px; }
        .section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        
        /* 订单卡片 */
        .order-card { border: 1.5px solid #f0f0f0; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .order-id { font-size: 13px; color: #999; }
        .order-status { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-pending { background: #fff7e6; color: #fa8c16; }
        .status-confirmed { background: #f6ffed; color: #52c41a; }
        .status-cancelled { background: #fff1f0; color: #ff4d4f; }
        
        .order-room { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .order-dates { font-size: 13px; color: #666; margin-bottom: 8px; }
        .order-guest { display: flex; justify-content: space-between; font-size: 14px; }
        .order-price { font-size: 18px; font-weight: 700; color: #ff6b35; }
        
        .order-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-confirm { background: #52c41a; color: #fff; }
        .btn-cancel { background: #ff4d4f; color: #fff; }
        .btn-contact { background: #1890ff; color: #fff; }
        .btn:active { opacity: 0.85; }
        
        /* 房态管理 */
        .room-manager { margin-bottom: 12px; padding: 14px; background: #fafafa; border-radius: 10px; }
        .room-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .room-row:last-child { border-bottom: none; }
        .room-name { font-size: 14px; font-weight: 500; }
        .room-stock-info { font-size: 12px; color: #666; }
        .stock-btn { padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; }
        .stock-btn.on { border-color: #52c41a; color: #52c41a; }
        .stock-btn.off { border-color: #ff4d4f; color: #ff4d4f; }
        
        .empty { text-align: center; padding: 40px; color: #999; }
        .empty-icon { font-size: 48px; margin-bottom: 10px; }
        
        /* 弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 16px; width: 90%; max-width: 360px; padding: 24px; }
        .modal-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 16px; }
        .modal-content { font-size: 14px; color: #666; line-height: 1.6; text-align: center; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .modal-btn-cancel { background: #f5f5f5; color: #666; }
        .modal-btn-confirm { background: #ff6b35; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏨 酒店管理后台</h1>
        <p>实时订单管理 · 房态控制</p>
    </div>

    <!-- 统计卡片 -->
    <div style="padding: 0 8px; margin-top: -10px;">
        <div class="section" style="padding: 14px;">
            <div style="display: flex; gap: 12px;">
                <div style="flex:1;text-align:center;padding:12px;background:#fff7e6;border-radius:10px;">
                    <div style="font-size:26px;font-weight:700;color:#fa8c16;" id="statPending">0</div>
                    <div style="font-size:12px;color:#999;margin-top:4px;">待确认</div>
                </div>
                <div style="flex:1;text-align:center;padding:12px;background:#f6ffed;border-radius:10px;">
                    <div style="font-size:26px;font-weight:700;color:#52c41a;" id="statConfirmed">0</div>
                    <div style="font-size:12px;color:#999;margin-top:4px;">已确认</div>
                </div>
                <div style="flex:1;text-align:center;padding:12px;background:#fff1f0;border-radius:10px;">
                    <div style="font-size:26px;font-weight:700;color:#ff4d4f;" id="statToday">0</div>
                    <div style="font-size:12px;color:#999;margin-top:4px;">今日收入</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        <!-- 房态管理 -->
        <div class="section">
            <div class="section-title">🛏️ 房态管理</div>
            <div id="roomManager"></div>
        </div>

        <!-- 订单列表 -->
        <div class="section">
            <div class="section-title">📋 今日订单</div>
            <div id="orderList">
                <div class="empty">
                    <div class="empty-icon">📦</div>
                    <div>暂无订单</div>
                    <div style="font-size:12px;margin-top:6px;">有订单时会在这里显示</div>
                </div>
            </div>
        </div>

        <!-- 操作说明 -->
        <div class="section" style="background:#f0f7ff;">
            <div class="section-title" style="color:#1890ff;">💡 操作提示</div>
            <div style="font-size:13px;color:#666;line-height:1.8;">
                1. 收到微信通知后，在这里确认订单<br>
                2. 点击「确认」会给客人发短信通知<br>
                3. 点击「拨打电话」可直接联系客人<br>
                4. 实时调整房态，避免超售
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-title">✅ 确认订单</div>
            <div class="modal-content" id="confirmContent"></div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="doConfirm()">确认</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 数据状态 ==========
        let orders = [];
        let roomStatus = {
            standard: true,
            king: true,
            suite: true
        };
        let currentOrderId = null;

        const ROOM_NAMES = {
            standard: '标准双床房',
            king: '豪华大床房',
            suite: '行政套房'
        };

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderRoomManager();
            loadOrders();
            // 每30秒刷新一次
            setInterval(loadOrders, 30000);
        });

        // ========== 加载订单 ==========
        async function loadOrders() {
            try {
                const res = await fetch('/api/order?action=list');
                const data = await res.json();
                if (data.orders) orders = data.orders;
            } catch(e) {
                // MVP阶段暂无真实数据
                orders = [];
            }
            renderOrders();
            updateStats();
        }

        // ========== 渲染 ==========
        function renderRoomManager() {
            const el = document.getElementById('roomManager');
            const rooms = [
                { id: 'standard', name: '标准双床房', stock: 8 },
                { id: 'king', name: '豪华大床房', stock: 5 },
                { id: 'suite', name: '行政套房', stock: 2 }
            ];
            
            el.innerHTML = rooms.map(r => `
                <div class="room-row">
                    <div>
                        <div class="room-name">${r.name}</div>
                        <div class="room-stock-info">剩余 <span id="stock-${r.id}">${roomStatus[r.id] ? r.stock : 0}</span> 间</div>
                    </div>
                    <button class="stock-btn ${roomStatus[r.id] ? 'on' : 'off'}" 
                            onclick="toggleRoom('${r.id}', ${r.stock})">
                        ${roomStatus[r.id] ? '可订' : '关房'}
                    </button>
                </div>
            `).join('');
        }

        function renderOrders() {
            const el = document.getElementById('orderList');
            
            if (orders.length === 0) {
                el.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📦</div>
                        <div>暂无订单</div>
                        <div style="font-size:12px;margin-top:6px;">有订单时会在这里显示</div>
                    </div>`;
                return;
            }
            
            el.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">${order.id}</span>
                        <span class="order-status ${order.status === 'confirmed' ? 'status-confirmed' : order.status === 'cancelled' ? 'status-cancelled' : 'status-pending'}">${order.statusText || '待确认'}</span>
                    </div>
                    <div class="order-room">${order.roomName}</div>
                    <div class="order-dates">📅 ${order.checkin} → ${order.checkout} · ${order.nights}晚</div>
                    <div class="order-guest">
                        <span>👤 ${order.guestName} · ${order.guestPhone}</span>
                        <span class="order-price">¥${order.finalTotal}</span>
                    </div>
                    ${order.status === 'pending' ? `
                    <div class="order-actions">
                        <button class="btn btn-confirm" onclick="showConfirmModal('${order.id}')">✅ 确认</button>
                        <button class="btn btn-contact" onclick="location.href='tel:${order.guestPhone}'">📞 联系</button>
                        <button class="btn btn-cancel" onclick="cancelOrder('${order.id}')">❌ 拒绝</button>
                    </div>` : ''}
                </div>
            `).join('');
        }

        function updateStats() {
            const pending = orders.filter(o => o.status === 'pending').length;
            const confirmed = orders.filter(o => o.status === 'confirmed').length;
            const todayIncome = orders.filter(o => o.status === 'confirmed').reduce((sum, o) => sum + (o.finalTotal || 0), 0);
            
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statConfirmed').textContent = confirmed;
            document.getElementById('statToday').textContent = todayIncome;
        }

        // ========== 房态控制 ==========
        function toggleRoom(roomId, maxStock) {
            roomStatus[roomId] = !roomStatus[roomId];
            document.getElementById(`stock-${roomId}`).textContent = roomStatus[roomId] ? maxStock : 0;
            const btn = event.target;
            btn.className = `stock-btn ${roomStatus[roomId] ? 'on' : 'off'}`;
            btn.textContent = roomStatus[roomId] ? '可订' : '关房';
            
            // TODO: 同步到后端
            showToast(roomStatus[roomId] ? '房型已开启' : '房型已关闭');
        }

        // ========== 订单操作 ==========
        function showConfirmModal(orderId) {
            currentOrderId = orderId;
            const order = orders.find(o => o.id === orderId);
            document.getElementById('confirmContent').innerHTML = `
                确认接收以下订单？<br><br>
                <strong>${order.roomName}</strong><br>
                ${order.checkin} - ${order.checkout}<br>
                客人：${order.guestName}<br>
                实付：<strong style="color:#ff6b35;">¥${order.finalTotal}</strong>
            `;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        async function doConfirm() {
            // TODO: 调用API确认订单
            const order = orders.find(o => o.id === currentOrderId);
            if (order) {
                order.status = 'confirmed';
                order.statusText = '已确认';
            }
            closeConfirmModal();
            renderOrders();
            updateStats();
            showToast('✅ 订单已确认，已通知客人');
        }

        async function cancelOrder(orderId) {
            if (!confirm('确定要拒绝此订单吗？')) return;
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'cancelled';
                order.statusText = '已拒绝';
            }
            renderOrders();
            updateStats();
            showToast('❌ 订单已拒绝');
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:300;';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }
    </script>
</body>
</html>
